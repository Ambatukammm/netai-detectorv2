[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netai-detector"
version = "2.1.0"
description = "Cross-platform network anomaly detection and monitoring toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ruel"}]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "pydantic>=2.5"
]

[project.optional-dependencies]
capture = ["scapy>=2.5"]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
netai = "netai_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
